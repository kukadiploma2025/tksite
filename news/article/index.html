<style>:root{color-scheme:dark;--bg:#0a0a0a;--panel:#121212;--text:#f5f5f5;--muted:#a1a1a1;--accent:#91c900;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.75 Arial,sans-serif}.wrap{width:min(850px,92%);margin:auto}header{border-bottom:1px solid var(--line);background:#0a0a0af2}nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:22px;font-weight:900;text-decoration:none;color:var(--text)}.logo span,.category{color:var(--accent)}a{color:inherit}.muted{color:var(--muted)}.back{font-size:14px;color:var(--muted)}main{padding:42px 0 75px}.category{text-transform:uppercase;font-size:12px;font-weight:bold;letter-spacing:2px}h1{font-size:clamp(32px,6vw,56px);line-height:1.12;letter-spacing:-1.5px;margin:12px 0 18px}.excerpt{font-size:20px;color:var(--muted);line-height:1.55}.meta{font-size:13px;color:var(--muted);margin:20px 0}.cover{width:100%;max-height:520px;object-fit:cover;border-radius:12px;margin:12px 0 25px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:28px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}.share{border:1px solid var(--line);border-radius:7px;padding:9px 13px;background:var(--panel);color:var(--text);cursor:pointer}@media(max-width:600px){.excerpt{font-size:18px}}</style></head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://jrlhnqbpbiltjlkklwly.supabase.co','sb_publishable_KKWmgdUCQzic1EpBHWuefw_ozU6Vzww');document.getElementById('year').textContent=new Date().getFullYear();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const slug=params.get('slug');async function load(){const root=document.getElementById('main');if(!slug){root.innerHTML='<div class="empty">Не указана публикация. <a href="/news/">Вернуться к новостям</a>.</div>';return}let q=db.from('news_articles').select('id,title,slug,excerpt,content,cover_image_url,published_at,seo_title,seo_description,news_categories(name)').eq('status','published').lte('published_at',new Date().toISOString());let res=await q.eq('slug',slug).maybeSingle();if(!res.data&&!res.error)res=await db.from('news_articles').select('id,title,slug,excerpt,content,cover_image_url,published_at,seo_title,seo_description,news_categories(name)').eq('status','published').lte('published_at',new Date().toISOString()).eq('id',slug).maybeSingle();const a=res.data;if(res.error||!a){root.innerHTML='<div class="empty">Новость не найдена или ещё не опубликована. <a href="/news/">Вернуться к ленте</a>.</div>';return}document.title=(a.seo_title||a.title)+' — KUKANDRIO NEWS';const desc=a.seo_description||a.excerpt||a.title;document.querySelector('meta[name="description"]').content=desc;document.querySelector('meta[property="og:title"]').content=a.seo_title||a.title;document.querySelector('meta[property="og:description"]').content=desc;document.querySelector('meta[property="og:url"]').content=location.href;let canonical=document.querySelector('link[rel="canonical"]');canonical.href=location.href;root.innerHTML='<div class="category">'+esc(a.news_categories?.name||'Новости')+'</div><h1>'+esc(a.title)+'</h1>'+(a.excerpt?'<div class="excerpt">'+esc(a.excerpt)+'</div>':'')+'<div class="meta">'+(a.published_at?new Date(a.published_at).toLocaleDateString('ru-RU'):'')+' · KUKANDRIO NEWS</div>'+(a.cover_image_url?'<img class="cover" src="'+esc(a.cover_image_url)+'" alt="'+esc(a.title)+'">':'')+'<article class="content">'+esc(a.content)+'</article><p style="margin-top:35px"><button class="share" id="share">Поделиться новостью ↗</button> <a class="back" href="/news/">← Все новости</a></p>';document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:a.title,text:desc,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Ссылка скопирована')}}catch(e){}}}load();
