<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новости — KUKANDRIO</title><meta name="description" content="Новости и публикации KUKANDRIO из Астаны."><link rel="canonical" href="https://kukandrio.kz/news/">
<style>:root{color-scheme:dark;--bg:#0a0a0a;--panel:#121212;--text:#f5f5f5;--muted:#a1a1a1;--accent:#91c900;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,92%);margin:auto}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a0a0af2}nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900}.logo span,h1 span{color:var(--accent)}.muted{color:var(--muted)}.hero{padding:60px 0 28px}.tag{color:var(--accent);text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:bold}h1{font-size:clamp(38px,7vw,70px);line-height:1.05;margin:12px 0}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:30px;padding:9px 15px;cursor:pointer}.filters button.active{background:var(--accent);color:#101010}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:12px 0 70px}.article{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#1b1b1b}.body{padding:18px;display:flex;flex-direction:column;flex:1}.category{color:var(--accent);font-size:12px;font-weight:bold;text-transform:uppercase}.article h2{font-size:22px;line-height:1.25;margin:8px 0}.article p{color:var(--muted);font-size:14px}.date{font-size:12px;color:var(--muted);margin-top:auto}.empty{border:1px dashed var(--line);padding:35px;border-radius:12px;color:var(--muted);grid-column:1/-1}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="wrap"><nav><a class="logo" href="/">KUK<span>ANDRIO</span></a><a class="muted" href="/">← На главную</a></nav></div></header><main class="wrap"><section class="hero"><div class="tag">KUKANDRIO / NEWS</div><h1>Новости и <span>публикации.</span></h1><p class="muted">Главное, что происходит вокруг нас. Факты, события и мнения.</p><div id="filters" class="filters"><button class="active" data-id="all">Все материалы</button></div></section><section id="articles" class="grid"><div class="empty">Загружаем публикации…</div></section></main><footer><div class="wrap">© <span id="year"></span> KUKANDRIO · Астана, Казахстан</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://jrlhnqbpbiltjlkklwly.supabase.co','sb_publishable_KKWmgdUCQzic1EpBHWuefw_ozU6Vzww');let rows=[],category='all';document.getElementById('year').textContent=new Date().getFullYear();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const list=category==='all'?rows:rows.filter(a=>a.category_id===category);const root=document.getElementById('articles');if(!list.length){root.innerHTML='<div class="empty">Пока нет опубликованных материалов. Загляни позже.</div>';return}root.innerHTML=list.map(a=>'<article class="article">'+(a.cover_image_url?'<img class="cover" loading="lazy" src="'+esc(a.cover_image_url)+'" alt="">':'<div class="cover"></div>')+'<div class="body"><div class="category">'+esc(a.news_categories?.name||'Новости')+'</div><h2>'+esc(a.title)+'</h2><p>'+esc(a.excerpt||'')+'</p><div class="date">'+(a.published_at?new Date(a.published_at).toLocaleDateString('ru-RU'):'')+'</div></div></article>').join('')}async function load(){const [cats,arts]=await Promise.all([db.from('news_categories').select('id,name').eq('is_active',true).order('sort_order'),db.from('news_articles').select('id,title,excerpt,cover_image_url,category_id,published_at,news_categories(name)').eq('status','published').lte('published_at',new Date().toISOString()).order('published_at',{ascending:false})]);if(arts.error){document.getElementById('articles').innerHTML='<div class="empty">Не удалось загрузить публикации. Проверь настройки базы данных.</div>';return}rows=arts.data||[];if(cats.data?.length)document.getElementById('filters').innerHTML='<button class="active" data-id="all">Все материалы</button>'+cats.data.map(c=>'<button data-id="'+esc(c.id)+'">'+esc(c.name)+'</button>').join('');document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{category=b.dataset.id;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()});render()}load();
</script></body></html>
