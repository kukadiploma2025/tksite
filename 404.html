<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1020">
  <title>Страница не найдена — KUKANDRIO</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#111a2e;--text:#f5f7ff;--muted:#9ba8c3;--accent:#7c9cff;--line:#26324d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#18284a 0%,var(--bg) 58%);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    main{width:min(100%,520px);text-align:center;background:rgba(17,26,46,.88);border:1px solid var(--line);border-radius:24px;padding:clamp(28px,7vw,48px);box-shadow:0 24px 80px #0005}
    .mark{width:52px;height:52px;display:grid;place-items:center;margin:0 auto 22px;border-radius:16px;background:#20345e;color:var(--accent);font-weight:800;font-size:20px;letter-spacing:-1px}
    .code{font-size:clamp(56px,15vw,84px);line-height:1;font-weight:800;letter-spacing:-.07em;margin:0;color:var(--accent)}
    h1{font-size:24px;margin:18px 0 8px}
    p{color:var(--muted);margin:0 auto;max-width:360px}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    a{display:inline-block;text-decoration:none;border-radius:12px;padding:11px 17px;font-weight:650}
    .primary{background:var(--accent);color:#081126}.secondary{border:1px solid var(--line);color:var(--text)}
    footer{margin-top:28px;color:#64718c;font-size:12px;letter-spacing:.12em}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">K</div>
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или страница больше недоступна. Проверь ссылку или вернись на главную.</p>
    <div class="actions">
      <a class="primary" href="/">На главную</a>
      <a class="secondary" href="javascript:history.back()">Назад</a>
    </div>
    <footer>KUKANDRIO</footer>
  </main>
</body>
</html>
